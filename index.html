<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IFC VR – Viewer</title>
    <style>
      :root {
        --bg: #14171c;
        --panel: #1d2229cc;
        --panel-solid: #1d2229;
        --text: #e8ecf1;
        --muted: #9aa7b5;
        --accent: #38b2ac;
        --accent2: #2c9a94;
        --border: #313a45;
        --err: #f56565;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }

      /* ---------- Seitenleiste (Desktop) ---------- */
      #sidebar {
        position: fixed;
        top: 12px;
        left: 12px;
        bottom: 12px;
        width: 320px;
        background: var(--panel);
        backdrop-filter: blur(8px);
        border: 1px solid var(--border);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        z-index: 10;
      }
      #sidebar.hidden { display: none; }
      #sidebar header {
        padding: 14px 16px 10px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      #sidebar header h1 { margin: 0; font-size: 1.05rem; }
      #sidebar header a { color: var(--accent); font-size: 0.8rem; text-decoration: none; }
      #sidebarBody { flex: 1; overflow-y: auto; padding: 12px 16px 16px; }
      .section { margin-bottom: 18px; }
      .section h2 {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 8px;
      }
      .btn {
        background: var(--accent);
        border: none;
        color: #08312f;
        font-weight: 600;
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
        font-size: 0.88rem;
      }
      .btn:hover { background: var(--accent2); }
      .btn.secondary {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
        font-weight: 500;
      }
      .btn.secondary:hover { border-color: var(--accent); color: var(--accent); }
      .btn.active { outline: 2px solid var(--accent); }
      .btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 4px;
        border-radius: 6px;
        font-size: 0.9rem;
      }
      .row:hover { background: #ffffff10; }
      .row input[type="checkbox"] { accent-color: var(--accent); }
      .row .grow { flex: 1; word-break: break-all; }
      .row .x {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 1rem;
        padding: 0 4px;
      }
      .row .x:hover { color: var(--err); }
      .row .mini {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--accent);
        border-radius: 6px;
        padding: 2px 10px;
        cursor: pointer;
        font-size: 0.8rem;
      }
      .row .mini:hover { border-color: var(--accent); }
      .row.unloaded .grow { color: var(--muted); }
      .empty { color: var(--muted); font-size: 0.85rem; font-style: italic; }
      #projectSelect {
        width: 100%;
        background: var(--panel-solid);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 10px;
        font-size: 0.9rem;
      }
      #props table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
      #props td { padding: 3px 6px 3px 0; vertical-align: top; word-break: break-word; }
      #props td:first-child { color: var(--muted); white-space: nowrap; max-width: 130px; overflow: hidden; text-overflow: ellipsis; }
      #props .pset {
        font-weight: 600;
        padding-top: 10px;
        color: var(--accent);
      }
      #hud {
        position: fixed;
        bottom: 12px;
        right: 12px;
        z-index: 10;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      #hud .hint { color: var(--muted); font-size: 0.8rem; background: var(--panel); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); }
      #vrBtn { display: none; }
      #vrBtn.available { display: inline-block; }
      #loading {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: #14171caa;
        z-index: 20;
        font-size: 1.05rem;
      }
      #loading.visible { display: flex; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <aside id="sidebar">
      <header>
        <h1>IFC&nbsp;VR Viewer</h1>
        <a href="./convert.html">→ Konverter</a>
      </header>
      <div id="sidebarBody">
        <div class="section">
          <h2>Projekt</h2>
          <select id="projectSelect">
            <option value="">– kein Projekt –</option>
          </select>
          <div class="btnrow" style="margin-top: 8px">
            <button class="btn secondary" id="projectNew">Neues Projekt</button>
            <button class="btn secondary" id="projectDelete" title="Aktives Projekt löschen">Löschen</button>
          </div>
          <div class="empty" id="storageInfo" style="margin-top: 6px"></div>
        </div>

        <div class="section">
          <div class="btnrow">
            <button class="btn" id="loadBtn">Modelle hinzufügen (.frag)</button>
            <input id="fragInput" type="file" accept=".frag" multiple hidden />
          </div>
        </div>

        <div class="section">
          <h2>Teilmodelle</h2>
          <div id="modelList"><div class="empty">Noch keine Modelle geladen.</div></div>
        </div>

        <div class="section">
          <h2>Geschosse</h2>
          <div id="storeyList"><div class="empty">–</div></div>
        </div>

        <div class="section">
          <h2>Navigation</h2>
          <div class="btnrow">
            <button class="btn secondary active" id="modeOrbit">Orbit</button>
            <button class="btn secondary" id="modeEgo">Begehen (WASD)</button>
          </div>
        </div>

        <div class="section">
          <h2>Werkzeuge</h2>
          <div class="btnrow">
            <button class="btn secondary active" id="toolSelect">Auswählen</button>
            <button class="btn secondary" id="toolMeasure">Messen</button>
            <button class="btn secondary" id="toolClip">Schnitt</button>
          </div>
          <div class="btnrow" id="clipOpts" style="margin-top: 8px; display: none">
            <button class="btn secondary" id="clipFlip">Umkehren</button>
            <button class="btn secondary" id="clipOff">Schnitt aus</button>
          </div>
          <div class="btnrow" id="measureOpts" style="margin-top: 8px; display: none">
            <button class="btn secondary" id="measureClear">Messungen löschen</button>
          </div>
        </div>

        <div class="section">
          <h2>Eigenschaften</h2>
          <div id="props"><div class="empty">Bauteil anklicken …</div></div>
        </div>
      </div>
    </aside>

    <div id="hud">
      <span class="hint" id="hudHint">Modelle laden, dann mit der Maus navigieren</span>
      <button class="btn" id="vrBtn">VR starten</button>
    </div>

    <div id="loading">Lade Modell …</div>

    <script type="module" src="./src/viewer/main.ts"></script>
  </body>
</html>
